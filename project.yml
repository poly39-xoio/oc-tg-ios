name: OC
options:
  bundleIdPrefix: io.xoio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  OC:
    type: application
    platform: iOS
    sources:
      - path: Sources/AppDelegate.swift
      - path: Sources/LocalWebServer.swift
      - path: Sources/WebViewController.swift
      - path: Sources/Trace.swift
      - path: Sources/Assets/Assets.xcassets
      - path: Resources/web
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: OC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: 選擇照片傳送 / Pick photos to send
        NSPhotoLibraryAddUsageDescription: 儲存圖片 / Save images
        NSCameraUsageDescription: 拍照傳送 / Take photos to send
        NSMicrophoneUsageDescription: 語音訊息需要麥克風 / Microphone access for voice messages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.xoio.oc
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
